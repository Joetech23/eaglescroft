<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001e60" />
    <title>You're offline — Eaglescroft</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #fff;
        background: radial-gradient(70% 50% at 50% 0%, rgba(37,99,235,.16) 0%, transparent 60%), linear-gradient(180deg, #030d2e 0%, #001033 55%, #020a24 100%); }
      main { max-width: 360px; padding: 24px; }
      img { width: 72px; opacity: .95 }
      p.k { font: 500 11px/1 ui-monospace, monospace; letter-spacing: .2em; text-transform: uppercase; color: #93c5fd; margin: 22px 0 10px }
      h1 { font-size: 26px; margin: 0 0 10px }
      p { color: rgba(255,255,255,.6); line-height: 1.55; margin: 0 0 22px }
      button { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 700; color: #fff; background: linear-gradient(180deg,#3b76f0,#1d4ed8); cursor: pointer }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/eagle-white.png" alt="" />
      <p class="k">Eaglescroft portal</p>
      <h1>You&rsquo;re offline.</h1>
      <p>We&rsquo;ll reconnect as soon as you&rsquo;re back online. Your messages and tasks are safe.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
